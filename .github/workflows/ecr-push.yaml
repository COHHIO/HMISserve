name: Build and Push to ECR

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_call:

permissions:
  id-token: write
  contents: read

# A newer push to the same PR (or to master) cancels the older build.
concurrency:
  group: ecr-push-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: hmis-serve

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647857229900:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, verify, and push docker image to Amazon ECR
        env:
          IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          PR_TAG: pr-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
        run: |
          # PRs get only a pr-<n>-<sha> tag. Only master gets :<sha> and :latest.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TAGS="$PR_TAG"
          else
            TAGS="$GITHUB_SHA latest"
          fi
          FIRST="${TAGS%% *}"

          # Repo root is the build context so the image contains this checkout's code.
          docker build -f aws/Dockerfile -t "$IMAGE:$FIRST" .

          # Shows the installed source: should be local, not a GitHub SHA.
          docker run --rm "$IMAGE:$FIRST" Rscript -e 'print(packageDescription("HMISserve"))'

          # Prints every package version and the pinned GitHub SHAs, so two builds
          # of the same commit on different days can be compared from the logs.
          docker run --rm "$IMAGE:$FIRST" Rscript -e '
            ip <- installed.packages()
            print(ip[order(ip[, "Package"]), c("Package", "Version")], quote = FALSE)
            for (p in c("HMIS", "HMISdata", "HMISprep", "clarity.looker", "UU")) {
              cat(p, packageDescription(p)$RemoteSha, "\n")
            }'

          for t in $TAGS; do
            docker tag "$IMAGE:$FIRST" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done

          echo "Pushed tags: $TAGS"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$FIRST"